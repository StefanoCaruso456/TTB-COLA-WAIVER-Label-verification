name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    env:
      # The build path runs `prisma generate` which needs a URL to parse
      # but does not need a live database. Verification logic is mocked.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
      USE_MOCK_EXTRACTION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npx vitest run

      - name: Production build
        run: npx next build
