name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    env:
      # The build path runs `prisma generate` which needs a URL to parse
      # but does not need a live database. Verification logic is mocked.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
      USE_MOCK_EXTRACTION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npx vitest run

      - name: Production build
        run: npx next build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttb
          POSTGRES_PASSWORD: ttb
          POSTGRES_DB: ttb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ttb:ttb@127.0.0.1:5432/ttb"
      USE_MOCK_EXTRACTION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migration preserves pre-existing data
        # Insert a row representing pre-existing production data using only
        # columns that pre-date the latest migration, then re-run migrations
        # and assert the row survives + the new nullable column is NULL.
        # Catches future destructive migrations that would silently drop rows
        # or fail on a populated DB.
        run: |
          export PGPASSWORD=ttb
          psql -h 127.0.0.1 -U ttb -d ttb <<'SQL'
          INSERT INTO "VerificationRecord" (
            id, "createdAt", "updatedAt", "productType", "sourceOfProduct",
            status, "applicationJson", "extractedJson", "reportJson"
          ) VALUES (
            'ci-pre-existing-row', NOW(), NOW(), 'wine', 'domestic',
            'pass', '{}'::jsonb, '{}'::jsonb, '{}'::jsonb
          );
          SQL
          npx prisma migrate deploy
          COUNT=$(psql -h 127.0.0.1 -U ttb -d ttb -t -A -c \
            "SELECT count(*) FROM \"VerificationRecord\" WHERE id = 'ci-pre-existing-row';")
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: pre-existing row was destroyed by migration (count=$COUNT, expected 1)"
            exit 1
          fi
          BATCH_REF=$(psql -h 127.0.0.1 -U ttb -d ttb -t -A -c \
            "SELECT COALESCE(\"batchSubmissionId\", 'NULL') FROM \"VerificationRecord\" WHERE id = 'ci-pre-existing-row';")
          if [ "$BATCH_REF" != "NULL" ]; then
            echo "FAIL: new batchSubmissionId column should be NULL for pre-existing row (got '$BATCH_REF')"
            exit 1
          fi
          # Clean up so subsequent steps see an empty table
          psql -h 127.0.0.1 -U ttb -d ttb -c \
            "DELETE FROM \"VerificationRecord\" WHERE id = 'ci-pre-existing-row';" > /dev/null
          echo "OK — migration preserved pre-existing data"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Start dev server for fixture evals
        run: |
          PORT=3001 USE_MOCK_EXTRACTION=true npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ | grep -q "200"; then
              echo "dev server up"
              exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"
          cat /tmp/dev.log
          exit 1

      - name: Fixture eval quick sweep
        run: npm run eval:quick -- --url=http://localhost:3001

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi
